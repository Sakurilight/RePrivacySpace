plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}

android {
    compileSdk 32
    buildToolsVersion "34.0.0"

    // versionName is the single source of truth; versionCode = MAJOR*100000 + MINOR*1000 + PATCH.
    def appVersionName = "0.1.0"
    def versionParts = appVersionName.tokenize('.')
    if (versionParts.size() != 3) {
        throw new GradleException("versionName must be MAJOR.MINOR.PATCH, got: $appVersionName")
    }
    def vMajor = versionParts[0] as int
    def vMinor = versionParts[1] as int
    def vPatch = versionParts[2] as int
    [vMajor, vMinor, vPatch].each { v ->
        if (v < 0 || v > 99) {
            throw new GradleException("each version segment must be 0-99, got: $appVersionName")
        }
    }
    def appVersionCode = vMajor * 100000 + vMinor * 1000 + vPatch

    defaultConfig {
        applicationId "com.reprivacyspace.app"
        minSdk 26
        targetSdk 32
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            // The signing key is deliberately kept outside the repository.  Provide
            // keystore/signing.properties (storeFile, storePassword, keyAlias, keyPassword)
            // or the Space_* environment variables; nothing is committed.
            def signingPropsFile = rootProject.file("keystore/signing.properties")
            if (signingPropsFile.exists()) {
                def props = new Properties()
                signingPropsFile.withInputStream { props.load(it) }
                storeFile rootProject.file("keystore/" + props["storeFile"])
                storePassword props["storePassword"]
                keyAlias props["keyAlias"]
                keyPassword props["keyPassword"]
            } else if (System.env.Space_storeFile) {
                storeFile file(System.env.Space_storeFile)
                storePassword System.env.Space_storePassword
                keyAlias System.env.Space_keyAlias
                keyPassword System.env.Space_keyPassword
            } else {
                throw new GradleException(
                        "Missing signing configuration: keystore/signing.properties not found " +
                                "and Space_storeFile is not set.")
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion compose_version
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/**'
            excludes += 'okhttp3/**'
            excludes += 'kotlin/**'
            excludes += '**.bin'
            excludes += '**.properties'
        }
    }
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.material:material:$compose_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.1'
    implementation 'androidx.activity:activity-compose:1.4.0'
    implementation 'io.coil-kt:coil-compose:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
    compileOnly files('libs/android-30.jar')
    implementation 'androidx.navigation:navigation-compose:2.4.2'
    implementation 'com.google.accompanist:accompanist-insets:0.23.1'
    implementation 'com.google.accompanist:accompanist-insets-ui:0.23.1'
    implementation "com.google.accompanist:accompanist-flowlayout:0.23.1"
    implementation 'com.squareup.moshi:moshi:1.13.0'
    ksp("com.squareup.moshi:moshi-kotlin-codegen:1.13.0")
    compileOnly 'androidx.recyclerview:recyclerview:1.2.1'
}
